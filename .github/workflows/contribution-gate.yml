name: Contribution governance
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  discussion:
    types: [created, edited, deleted, category_changed, labeled, unlabeled, closed, reopened]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review event relay, Proposal review]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  discussions: write
  pull-requests: read
  issues: read
  actions: read
  statuses: write
concurrency:
  group: contribution-governance
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'PrismaX-Team/AgentFrontierExam-Tasks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Test trusted policy
        run: python3 -I .github/scripts/test_governance.py
      - name: Refresh live PR requirements
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/governance.py refresh
