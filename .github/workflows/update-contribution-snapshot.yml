name: Update contribution snapshot

on:
  repository_dispatch:
    types: [portal-updated]
  discussion:
    types: [created, edited, deleted, labeled, unlabeled, closed, reopened]
  workflow_run:
    workflows: [Contribution governance, Proposal review]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pull-requests: read
  issues: read
  actions: read
  statuses: read

concurrency:
  group: task-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The policy is always read from the trusted default branch. No PR code is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - name: Generate validated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pages/data
          python3 -I policy/.github/scripts/governance.py snapshot > pages/data/contributions.json.new
          python3 -m json.tool pages/data/contributions.json.new >/dev/null
          mv pages/data/contributions.json.new pages/data/contributions.json
      - name: Upload generated snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contribution-snapshot
          path: pages/data/contributions.json
  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: contribution-snapshot
          path: data
      - name: Save public data in this repository
        run: |
          git config user.name "Agent Frontier Exam Data Sync"
          git config user.email pages@users.noreply.github.com
          git add data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public contribution snapshot"
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy the updated site without rebuilding it
        id: deployment
        uses: actions/deploy-pages@v4
